[workspace]
members = ["crates/rftuf", "crates/rftuf-http", "crates/conformance"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
rftuf = { path = "crates/rftuf", default-features = false }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
futures-executor = "0.3"
tempfile = "3"
