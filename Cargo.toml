[workspace]
members = ["crates/rftuf", "crates/rftuf-http", "crates/conformance"]
resolver = "3"

[workspace.package]
repository = "https://github.com/arlosi/rftuf"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
rftuf = { version = "0.1", path = "crates/rftuf", default-features = false }
rftuf-http = { version = "0.1", path = "crates/rftuf-http", default-features = false }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
futures-executor = "0.3"
tempfile = "3"
