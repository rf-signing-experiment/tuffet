[workspace]
members = ["crates/tuffet", "crates/tuffet-http", "crates/conformance"]
resolver = "3"

[workspace.package]
repository = "https://github.com/rf-signing-experiment/tuffet"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.96"
# What `cargo package` ships: no tests, test data or changelog.
include = [
  "/src/**/*",
  "/examples/**/*",
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE*",
  "/README.md",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
tuffet = { version = "0.1.0", path = "crates/tuffet", default-features = false }
tuffet-http = { version = "0.1.0", path = "crates/tuffet-http", default-features = false }
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
futures-executor = "0.3.34"
tempfile = "3.27.0"
tracing = "0.1.44"
