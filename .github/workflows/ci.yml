name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Warnings fail the build, including those of clippy and rustdoc.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update && rustup default stable
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update && rustup default stable
      - name: Clippy (rustcrypto)
        run: cargo clippy --workspace --all-targets --locked
      - name: Clippy (aws-lc-rs)
        run: cargo clippy --workspace --all-targets --locked --no-default-features --features aws-lc-rs
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --locked --all-features

  # Each crypto backend, then both (which also compares them), in debug and
  # release builds. Some tests only run in release builds.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        profile: [dev, release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # aws-lc-sys needs NASM on Windows, unless allowed to use the NASM
      # objects it ships prebuilt.
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Build (rustcrypto)
        run: cargo build --workspace --all-targets --locked --profile ${{ matrix.profile }}
      - name: Test (rustcrypto)
        run: cargo test --workspace --locked --profile ${{ matrix.profile }}
      - name: Build (aws-lc-rs)
        run: cargo build --workspace --all-targets --locked --profile ${{ matrix.profile }} --no-default-features --features aws-lc-rs
      - name: Test (aws-lc-rs)
        run: cargo test --workspace --locked --profile ${{ matrix.profile }} --no-default-features --features aws-lc-rs
      - name: Build (all features)
        run: cargo build --workspace --all-targets --locked --profile ${{ matrix.profile }} --all-features
      - name: Test (all features)
        run: cargo test --workspace --locked --profile ${{ matrix.profile }} --all-features

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Build the examples
        run: cargo build --workspace --examples --locked
      - name: Run the download example
        # Against python-tuf's test repository, whose metadata expires on 2030-01-01.
        run: |
          repo=crates/rftuf/tests/data/python-tuf
          python3 -m http.server --bind 127.0.0.1 --directory "$repo" 8000 &
          curl --silent --fail --retry 10 --retry-connrefused --output /dev/null http://127.0.0.1:8000/metadata/root.json
          cargo run --locked -p rftuf-http --example download -- \
            http://127.0.0.1:8000/metadata/ http://127.0.0.1:8000/targets/ "$repo/metadata/root.json" \
            "$RUNNER_TEMP/metadata" file3.txt "$RUNNER_TEMP/file3.txt"
          cmp "$repo/targets/file3.txt" "$RUNNER_TEMP/file3.txt"

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - run: cargo doc --workspace --no-deps --all-features --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (the rust-version in Cargo.toml)
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          rustup toolchain install "$msrv" --profile minimal --no-self-update && rustup default "$msrv"
      - name: Test (rustcrypto)
        run: cargo test --workspace --locked
      - name: Test (all features)
        run: cargo test --workspace --locked --all-features

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      # Builds each published crate from its packaged archive.
      - run: cargo package --workspace --exclude rftuf-conformance --locked

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Install faketime
        run: sudo apt-get update && sudo apt-get install --yes faketime
      - name: tuf-conformance (rustcrypto)
        run: crates/conformance/run.sh
      - name: tuf-conformance (aws-lc-rs)
        run: crates/conformance/run.sh
        env:
          BACKEND: aws-lc-rs
