[package]
name = "tuffet-conformance"
version = "0.0.0"
description = "Client-under-test for the tuf-conformance test suite"
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.release]
release = false

[lints]
workspace = true

[features]
default = ["rustcrypto"]
# Cryptography backend of tuffet.
rustcrypto = ["tuffet/rustcrypto", "tuffet-http/rustcrypto"]
aws-lc-rs = ["tuffet/aws-lc-rs", "tuffet-http/aws-lc-rs"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
percent-encoding = "2.3.2"
tuffet.workspace = true
tuffet-http.workspace = true
tokio = { version = "1.53.2", features = ["macros", "rt"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
