[package]
name = "tuffet"
version = "0.1.0"
description = "A client library for The Update Framework (TUF)"
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
license.workspace = true
repository.workspace = true
include.workspace = true

[package.metadata.release]
pre-release-replacements = [
  {file="CHANGELOG.md", search="Unreleased", replace="{{version}}", min=1},
  {file="CHANGELOG.md", search="\\.\\.\\.HEAD", replace="...{{tag_name}}", exactly=1},
  {file="CHANGELOG.md", search="ReleaseDate", replace="{{date}}", min=1},
  {file="CHANGELOG.md", search="<!-- next-header -->", replace="<!-- next-header -->\n## [Unreleased] - ReleaseDate\n", exactly=1},
  {file="CHANGELOG.md", search="<!-- next-url -->", replace="<!-- next-url -->\n[Unreleased]: {{repository}}/compare/{{tag_name}}...HEAD", exactly=1},
]

[lints]
workspace = true

[features]
default = ["rustcrypto"]
# Cryptography backends: `aws-lc-rs` takes precedence if both are enabled.
rustcrypto = ["dep:sha2", "dep:ed25519-dalek", "dep:p256", "dep:p384", "dep:rsa", "dep:getrandom", "dep:rand_core", "dep:ml-dsa"]
aws-lc-rs = ["dep:aws-lc-rs"]

[dependencies]
bytes.workspace = true
futures-core = "0.3.34"
futures-util.workspace = true
glob = "0.3.4"
hex = "0.4.3"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
pem-rfc7468 = { version = "1.0.0", features = ["alloc"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile.workspace = true
thiserror = "2.0.21"
tracing.workspace = true

# `aws-lc-rs` backend
aws-lc-rs = { version = "1.18.1", optional = true }

# `rustcrypto` backend
ed25519-dalek = { version = "3.0.0", optional = true, features = ["pkcs8", "pem", "rand_core"] }
getrandom = { version = "0.4.3", optional = true, features = ["sys_rng"] }
ml-dsa = { version = "0.1.1", optional = true, default-features = false, features = ["alloc", "pkcs8", "rand_core", "zeroize"] }
p256 = { version = "0.14.0", optional = true, default-features = false, features = ["ecdsa", "pem", "std"] }
p384 = { version = "0.14.0", optional = true, default-features = false, features = ["ecdsa", "pem", "std"] }
rand_core = { version = "0.10.1", optional = true }
# Pinned: 0.10 is still a release candidate, but it is the only release line
# with constant-time arithmetic (RUSTSEC-2023-0071).
rsa = { version = "=0.10.0-rc.19", optional = true }
sha2 = { version = "0.11.0", optional = true }

[dev-dependencies]
futures-executor.workspace = true
snapbox = "1.2.2"
