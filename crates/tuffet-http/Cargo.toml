[package]
name = "tuffet-http"
version = "0.1.0"
description = "An HTTP transport for the tuffet TUF client, built on reqwest"
keywords = ["tuf", "the-update-framework"]
categories = ["network-programming", "cryptography"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true

[package.metadata.release]
pre-release-replacements = [
  {file="CHANGELOG.md", search="Unreleased", replace="{{version}}", min=1},
  {file="CHANGELOG.md", search="\\.\\.\\.HEAD", replace="...{{tag_name}}", exactly=1},
  {file="CHANGELOG.md", search="ReleaseDate", replace="{{date}}", min=1},
  {file="CHANGELOG.md", search="<!-- next-header -->", replace="<!-- next-header -->\n## [Unreleased] - ReleaseDate\n", exactly=1},
  {file="CHANGELOG.md", search="<!-- next-url -->", replace="<!-- next-url -->\n[Unreleased]: {{repository}}/compare/{{tag_name}}...HEAD", exactly=1},
]

[lints]
workspace = true

[features]
default = ["aws-lc-rs"]
# Each feature picks the TLS implementation of the default client and the
# cryptography backend of tuffet (see the README).
# rustls for TLS and AWS-LC for TUF: AWS-LC is the only crypto library.
aws-lc-rs = ["reqwest/rustls", "tuffet/aws-lc-rs"]
# The platform's TLS library and RustCrypto for TUF.
native-tls = ["reqwest/native-tls", "tuffet/rustcrypto"]

[dependencies]
futures-util.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "system-proxy"] }
tuffet.workspace = true
tracing.workspace = true
url = "2.5.8"

[dev-dependencies]
bytes.workspace = true
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tempfile.workspace = true
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread"] }
