# cargo-deny configuration, run by .github/workflows/audit.yml.
# Reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html
# Based on https://github.com/epage/_rust

[graph]
# Check every optional dependency: both crypto backends, and both TLS
# implementations of tuffet-http.
all-features = true

[output]
feature-depth = 1

[advisories]
ignore = [
  #{ id = "RUSTSEC-0000-0000", reason = "..." },
]

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MPL-2.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "ISC",
  "OpenSSL",
  "Zlib",
  "NCSA",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# Skip the license check of unpublished workspace crates (tuffet-conformance).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
