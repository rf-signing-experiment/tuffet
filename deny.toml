# cargo-deny configuration, run by .github/workflows/audit.yml.
# Reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html
# Based on https://github.com/epage/_rust

[graph]
# Check every optional dependency: both crypto backends, and both TLS
# implementations of tuffet-http.
all-features = true

[output]
feature-depth = 1

[advisories]
ignore = [
  # Marvin attack: timing of the `rsa` crate's private-key operations can leak
  # the key. No fixed release exists. The TUF client only verifies RSA
  # signatures, which uses public keys. RSA signing with `PrivateKey` and the
  # rustcrypto backend is affected where an attacker can time it (an online
  # signer); the aws-lc-rs backend does not use `rsa`.
  { id = "RUSTSEC-2023-0071", reason = "only public-key RSA operations in the client; see the comment above" },
]

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",
  "CC0-1.0",
  "ISC",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# Skip the license check of unpublished workspace crates (tuffet-conformance).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
